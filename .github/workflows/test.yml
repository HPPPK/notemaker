name: Validate Notemaker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python skills/notemaker/scripts/build_note.py examples/general-note.json --output examples/general-note.html
      - run: npx playwright install --with-deps chromium
      - run: npm test
