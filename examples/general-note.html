<script id="notemaker-data" type="application/json">{"version": 1, "title": "把学到的、讨论的、读过的，连成一份笔记。", "subtitle": "Notemaker / 通用示例 · 所有场景与数据均为虚构", "intro": "这份示例把课程学习、会议记录和文献阅读放进同一本笔记。先交代整件事的背景，再按大主题进入具体内容；每个结论都能看出来自材料、讨论，还是整理者的推断。", "summary": "这份笔记围绕一个共同问题：怎样把零散的信息整理成可以回看、核对和修改的知识？\n课程部分先解释概念与例子；会议部分区分讨论、已确认决定和待办；文献部分区分作者声称什么、证据支持什么、还不知道什么。三类材料共用导航和编辑方式，但不强迫使用同一套内容结构。\n点击 Edit 可以直接修改正文、整体介绍和大章节总结。点击 Save 才会请求写入本地 HTML；不支持直接写文件的浏览器会导出完整的新 HTML。", "settings": {"theme": "light", "accent": "olive", "fontScale": 1}, "sections": [{"id": "course", "title": "课程笔记：从问题到例子", "intro": "课程内容应先讲这门课解决什么问题，再解释概念以及它与已有知识的关系。例子用来让抽象定义变得具体。", "summary": "不要只抄幻灯片。保留概念的含义、一个能算清楚的例子，以及你暂时不理解的问题。课程材料与自己的解释应区分。"}, {"id": "meeting", "title": "会议记录：从讨论到行动", "intro": "一份好会议笔记先说明会议为什么开、讨论范围是什么，再把讨论、决定、行动分别记清楚。", "summary": "被提到的想法不等于已通过的决定。待办应保留负责人、交付物和期限；材料没有写明时，标记待确认，不自行编造。"}, {"id": "reading", "title": "文献阅读：从主张到证据", "intro": "阅读论文时，先问作者研究什么问题，再问用了什么办法、给了哪些证据、这些证据覆盖了什么边界。", "summary": "论文中的结论不是无条件事实。把研究问题、方法、实证与局限分开记录，有助于比较不同文献，也能避免把整理者推断写成作者原话。"}], "topics": [{"id": "course-example", "section": "course", "title": "一个概念，配一个真正有用的例子", "intro": "例子要能解释计算到底在做什么，而不是只展示公式。", "body": "\u003ch2>平均值在概括什么？\u003c/h2>\u003cp>假设三次观测为 2、4、6。平均值为 4：它概括整体水平，不保留每一次观测的细节。这里的数值是教学例子，不是实验结果。\u003c/p>\u003cpre>\u003ccode>values = [2, 4, 6]\nmean = sum(values) / len(values)\u003c/code>\u003c/pre>\u003caside class=\"callout\">\u003cstrong>关键区别\u003c/strong>\u003cp>平均值一样，不代表波动一样。下一步应通过图或实际数字比较，而不是马上引入更多术语。\u003c/p>\u003c/aside>\u003cfigure>\u003csvg viewBox=\"0 0 800 180\" role=\"img\" aria-label=\"材料到解释再到核对的三步关系\">\u003crect x=\"20\" y=\"45\" width=\"200\" height=\"85\" fill=\"#edf0e7\"/>\u003ctext x=\"60\" y=\"95\" fill=\"#26302b\" font-size=\"24\">读材料\u003c/text>\u003cline x1=\"235\" y1=\"88\" x2=\"285\" y2=\"88\" stroke=\"#526146\" stroke-width=\"3\"/>\u003crect x=\"300\" y=\"45\" width=\"200\" height=\"85\" fill=\"#edf0e7\"/>\u003ctext x=\"340\" y=\"95\" fill=\"#26302b\" font-size=\"24\">用例子解释\u003c/text>\u003cline x1=\"515\" y1=\"88\" x2=\"565\" y2=\"88\" stroke=\"#526146\" stroke-width=\"3\"/>\u003crect x=\"580\" y=\"45\" width=\"200\" height=\"85\" fill=\"#edf0e7\"/>\u003ctext x=\"620\" y=\"95\" fill=\"#26302b\" font-size=\"24\">回到来源核对\u003c/text>\u003c/svg>\u003cfigcaption>示意图：整理方法，不表示研究数据。\u003c/figcaption>\u003c/figure>", "sources": ["fictional"]}, {"id": "course-questions", "section": "course", "title": "把还没懂的地方留下来", "intro": "开放问题也是笔记的一部分；它们不应该被一段看似完整的总结遮住。", "body": "\u003ch2>待澄清的问题\u003c/h2>\u003cul>\u003cli>什么时候平均值不能代表典型情况？\u003c/li>\u003cli>图形能补充平均值丢掉的哪些信息？\u003c/li>\u003c/ul>\u003cp>你可以点击 Edit，把这些问题换成自己真正卡住的地方。\u003c/p>", "sources": ["fictional"]}, {"id": "meeting-decisions", "section": "meeting", "title": "讨论过，不等于决定了", "intro": "以下只是虚构会议示例，用来展示记录结构。", "body": "\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>内容\u003c/th>\u003cth>状态\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>讨论\u003c/td>\u003ctd>是否增加一个快速入门页\u003c/td>\u003ctd>提出方案，未确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>决定\u003c/td>\u003ctd>先验证离线编辑后的文件能重新打开\u003c/td>\u003ctd>示例中的已确认决定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>待确认\u003c/td>\u003ctd>下次评审时间\u003c/td>\u003ctd>材料未提供\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "sources": ["fictional"]}, {"id": "meeting-actions", "section": "meeting", "title": "待办写清楚交付物", "intro": "没有负责人或日期时，准确的记录是待确认。", "body": "\u003ctable>\u003cthead>\u003ctr>\u003cth>行动\u003c/th>\u003cth>交付物\u003c/th>\u003cth>负责人\u003c/th>\u003cth>期限\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>验证保存\u003c/td>\u003ctd>重新打开导出的 HTML，确认文字和图片仍在\u003c/td>\u003ctd>待确认\u003c/td>\u003ctd>待确认\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "sources": ["fictional"]}, {"id": "reading-evidence", "section": "reading", "title": "作者主张与证据分开写", "intro": "这里没有引用真实论文，避免用虚构文献制造可信度。", "body": "\u003ch2>阅读模板\u003c/h2>\u003cul>\u003cli>问题：作者具体想解决什么？\u003c/li>\u003cli>方法：输入、过程和输出是什么？\u003c/li>\u003cli>证据：实验、理论还是案例？\u003c/li>\u003cli>局限：结论在哪些条件下没有验证？\u003c/li>\u003c/ul>\u003cblockquote>如果材料未给出数值，就写未提供，而不是补一个看起来合理的结果。\u003c/blockquote>", "sources": ["fictional"]}, {"id": "reading-comparison", "section": "reading", "title": "把比较写成可核对的表", "intro": "比较不同文献时，先统一比较的问题和评价尺度。", "body": "\u003ctable>\u003cthead>\u003ctr>\u003cth>比较维度\u003c/th>\u003cth>需要记录\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>任务\u003c/td>\u003ctd>研究对象与假设\u003c/td>\u003c/tr>\u003ctr>\u003ctd>评价\u003c/td>\u003ctd>指标、数据与实验条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>证据边界\u003c/td>\u003ctd>未测场景、缺失信息、复现条件\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "sources": ["fictional"]}], "sources": [{"id": "fictional", "label": "Notemaker 通用演示 · 虚构材料，非真实课程、会议或论文", "url": "", "kind": "illustrative example"}]}</script><script>/* Optional, deterministic classroom widgets. Never required for meeting/literature notes. */
window.NotemakerWidgets={init(scope){
  const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  const line=(x1,y1,x2,y2,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${extra}/>`;
  const txt=(x,y,s,extra='')=>`<text x="${x}" y="${y}" font-family="system-ui,sans-serif" font-size="12" fill="currentColor" ${extra}>${escape(s)}</text>`;
  const lag=scope.querySelector('[data-lab=lag]');

  $('image-dialog').addEventListener('close',()=>$('large-image').removeAttribute('src'));
  $('search').addEventListener('input',nav);$('print').addEventListener('click',()=>{collect();window.print();});
  $('menu').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('shade').hidden=!open;$('menu').setAttribute('aria-expanded',String(open));});
  $('shade').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('shade').hidden=true;$('menu').setAttribute('aria-expanded','false');});
  document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();if(editing)nativeSave(event.shiftKey);}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('search').focus();}});
  document.addEventListener('click',event=>{if(saving&&event.target.closest('a'))event.preventDefault();});
  window.addEventListener('beforeunload',event=>{if(dirty||saving){event.preventDefault();event.returnValue='';}});
  window.addEventListener('hashchange',route);
  window.Notemaker=Object.freeze({getModel:()=>{collect();return clone(model);},exportHTML:()=>serialized(candidate())});
  route();
})();
</script></body></html>
