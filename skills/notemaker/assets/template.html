<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>{{TITLE}} · Notemaker</title><style>{{CSS}}</style></head>
<body>
<a href="#content" class="skip">跳到正文 / Skip to content</a>
<aside id="sidebar"><a class="wordmark" href="#home">note<span>maker</span><small>一份可以继续生长的笔记</small></a><label class="search-label" for="search">检索这份笔记</label><input id="search" type="search" placeholder="搜索主题、解释、代码…"><nav id="navigation" aria-label="内容目录"></nav><p class="sidebar-footer">先看全貌，再进入细节。<br>离线阅读 · 编辑后手动保存</p></aside>
<button id="shade" aria-label="关闭目录" hidden></button>
<div class="shell"><header class="topbar"><button id="menu" aria-label="展开目录" aria-expanded="false">☰</button><span id="breadcrumb">主题总览</span><div class="actions"><span id="dirty-indicator" hidden>尚未保存</span><button id="edit">Edit · 编辑</button><button id="cancel" hidden>取消</button><button id="save" hidden class="primary">Save · 保存 HTML</button><button id="save-as" hidden>另存为</button><button id="export" hidden>下载 HTML 副本</button><button id="print">打印</button></div></header>
<div id="status" role="status" aria-live="polite">本地笔记 · 阅读模式</div>
<section id="editor-panel" hidden aria-label="笔记编辑设置"><div class="editor-heading"><strong>编辑这份笔记</strong><span>正文可直接点击修改；没有自动保存。</span></div><div class="settings-grid"><label>整份笔记标题<input id="document-title"></label><label>副标题<input id="document-subtitle"></label><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>强调色<select id="accent"><option value="olive">橄榄绿</option><option value="blue">蓝</option><option value="plum">紫</option><option value="terracotta">陶土红</option></select></label><label>字号<select id="font-scale"><option value="0.9">紧凑</option><option value="1">标准</option><option value="1.15">较大</option><option value="1.3">大字</option></select></label></div>
<div id="page-fields"><label id="page-title-label">当前页标题<input id="page-title"></label><label id="page-intro-label">当前页介绍<textarea id="page-intro" rows="3"></textarea></label><label id="summary-label">结尾总结（在对应总结页修改）<textarea id="page-summary" rows="4"></textarea></label></div>
<div class="edit-tools"><button id="apply">更新预览</button><button id="add-section">新增大章节</button><button id="add-topic">新增小节</button><button id="delete-topic" hidden>删除当前小节</button><label class="button" id="image-label">插入本地图片<input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><span>可修改正文、代码、图注；粘贴文本不会运行脚本。</span></div></section>
<main id="content" tabindex="-1"></main><footer class="page-footer">Notemaker · 独立 HTML · 内容和图片保存在你选择的文件里</footer></div>
<dialog id="image-dialog"><button id="close-image">关闭 / Close</button><img id="large-image" alt=""><p id="large-caption"></p></dialog>
<script id="notemaker-data" type="application/json">{{DATA}}</script><script>{{WIDGETS}}</script><script>{{JS}}</script></body></html>
