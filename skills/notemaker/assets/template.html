<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>{{TITLE}} · Notemaker</title><style>{{CSS}}</style></head>
<body>
<a href="#content" class="skip">跳到正文 / Skip to content</a>
<aside id="sidebar"><a class="wordmark" href="#home">note<span>maker</span><small>一份可以继续生长的笔记</small></a><label class="search-label" for="search">检索这份笔记</label><input id="search" type="search" placeholder="搜索主题、解释、代码…"><nav id="navigation" aria-label="内容目录"></nav><p class="sidebar-footer">先看全貌，再进入细节。<br>离线阅读 · 编辑后手动保存</p></aside>
<button id="shade" aria-label="关闭目录" hidden></button>
<div class="shell"><header class="topbar"><button id="menu" aria-label="展开目录" aria-expanded="false">☰</button><span id="breadcrumb">主题总览</span><div class="actions"><span id="dirty-indicator" hidden>尚未保存</span><button id="edit">Edit · 编辑</button><button id="cancel" hidden>取消</button><button id="save" hidden class="primary">Save · 保存到当前文件</button><button id="export" hidden>导出副本</button><button id="print">打印</button></div></header>
<div id="status" role="status" aria-live="polite">本地笔记 · 阅读模式</div>
<section id="editor-panel" hidden aria-label="笔记编辑设置"><div class="editor-heading"><strong>单元格编辑模式</strong><span>自由插入、修改、复制、排序和删除；点击 Save 才写回当前源文件。</span></div><details class="edit-settings"><summary>标题与外观设置</summary><div class="settings-grid"><label>整份笔记标题<input id="document-title"></label><label>副标题<input id="document-subtitle"></label><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>强调色<select id="accent"><option value="olive">橄榄绿</option><option value="blue">蓝</option><option value="plum">紫</option><option value="terracotta">陶土红</option></select></label><label>字号<select id="font-scale"><option value="0.9">紧凑</option><option value="1">标准</option><option value="1.15">较大</option><option value="1.3">大字</option></select></label></div><label id="page-title-label">当前页标题<input id="page-title"></label></details>
<div class="edit-tools"><button id="apply">更新标题预览</button><button id="add-section">新增大章节</button><button id="add-topic">新增小节</button><button id="move-page-up">板块 / 小节上移</button><button id="move-page-down">板块 / 小节下移</button><button id="delete-topic" hidden>删除当前小节</button><button id="delete-section">删除当前板块</button><label class="button" id="image-label">插入本地图片<input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label></div></section>
<main id="content" tabindex="-1"></main><footer class="page-footer">Notemaker · 阅读版可离线打开 · 用配套启动器编辑，Save 直接写回当前 HTML</footer></div>
<dialog id="image-dialog"><button id="close-image">关闭 / Close</button><img id="large-image" alt=""><p id="large-caption"></p></dialog>
<script id="notemaker-data" type="application/json">{{DATA}}</script><script>{{WIDGETS}}</script><script>{{NOTEBOOK}}</script><script>{{JS}}</script></body></html>
